name: Build Trimmer mod

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:   # lets you press "Run workflow" manually in the Actions tab

permissions:
  contents: write      # needed only for the optional tagged-release step below

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify the jar is a real Fabric mod
        run: |
          ls -l build/libs
          JAR=$(ls build/libs/trimmer-*.jar | grep -v -- '-sources' | head -n 1)
          echo "Checking $JAR"
          jar tf "$JAR" > jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt
          grep -q '^trimmer.mixins.json$' jar-contents.txt
          grep -q '^dev/trimmer/TrimmerClient.class$' jar-contents.txt
          grep -q '^dev/trimmer/mixin/MinecraftMixin.class$' jar-contents.txt
          grep -q '^dev/trimmer/mixin/ParticleEngineMixin.class$' jar-contents.txt
          # Loom produces a refmap when mixins are remapped correctly
          grep -q 'refmap' jar-contents.txt
          echo "Jar looks correct."

      - name: Upload installable mod jar
        uses: actions/upload-artifact@v4
        with:
          name: trimmer-fabric-1.21.11-jar
          path: |
            build/libs/trimmer-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Optional: push a tag like v1.0.0 and the raw .jar is attached to a GitHub Release
      - name: Attach jar to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/trimmer-*.jar
            !build/libs/*-sources.jar
